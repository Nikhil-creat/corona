"use strict";
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),uid=()=>Math.random().toString(16).slice(2,10);
const NM=["Power Core","Cooling A","Cooling B","Compute 1","Compute 2","Turbine","Pump","Crane","Conveyor","Switchgear","Transformer","Control"];
const CR=[.95,.8,.8,.7,.7,.9,.6,.4,.5,.85,.9,.75];
const DEP=[[2,1],[3,1],[4,2],[5,3],[6,1],[7,2],[8,6],[9,6],[10,11],[1,10],[12,10],[4,12]];
const LBL={thermal:"thermal_overheat",bearing:"bearing_wear",crack:"structural_crack",electrical:"electrical_fault"};
const KW={thermal_overheat:"thermal",bearing_wear:"bearing",structural_crack:"structural",electrical_fault:"electrical"};
const ACT={throttle_load:{k:"percent",lo:10,hi:90,ph:0},schedule_inspection:{k:"hours",lo:1,hi:168,ph:0},isolate_node:{k:"grace_s",lo:0,hi:300,ph:1},emergency_shutdown:{k:"grace_s",lo:0,hi:60,ph:1}};
const KB=[["TSM-4.1","thermal","throttle_load","Above 85°C throttle load 10–90%."],["TSM-4.3","thermal","emergency_shutdown","Above 105°C controlled shutdown, grace ≤60 s, signed approval."],
["RMG-2.2","bearing","schedule_inspection","Bearing wear >6 mm/s: inspect within 1–168 h."],["RMG-2.5","bearing","isolate_node","Severity >0.7: isolate, grace 0–300 s."],
["SIP-7.1","structural","isolate_node","Confirmed crack: isolate ≤30 s, never throttle."],["SIP-7.2","structural","schedule_inspection","Minor stress: inspect within 12 h."],
["ESL-1.4","electrical","isolate_node","Electrical fault: isolate, grace ≤15 s."]];
const policy=(l,s)=>l=="thermal_overheat"?(s>.9?["emergency_shutdown",30]:["throttle_load",Math.round(40+s*70)]):l=="bearing_wear"?(s>.7?["isolate_node",60]:["schedule_inspection",Math.round(72-s*60)]):l=="structural_crack"?(s>.6?["isolate_node",30]:["schedule_inspection",12]):["isolate_node",15];
const N=NM.map((n,i)=>{const a=i/12*Math.PI*2;return{i,id:"N-"+String(i+1).padStart(2,"0"),n,cr:CR[i],x:Math.cos(a)*9,z:Math.sin(a)*9,t:55+Math.random()*8,v:2,s:32,h:[],f:null,cool:0,st:"nominal",busy:0,heat:0,log:[]}});
const ST={an:0,heal:0,mt:[],fl:1},pend=new Map(),used=new Set();let sel=null,key=null;
const dependents=i=>{const seen=new Set(),q=[i+1];while(q.length){const c=q.pop();DEP.forEach(([d,p])=>{if(p===c&&!seen.has(d)){seen.add(d);q.push(d)}})}return seen.size};
// ── simulation ──
function fault(n,l,peak){if(n.f)return false;n.f={l,left:24,peak:peak??.55+Math.random()*.43,age:0};return true}
function tick(){for(const n of N){
 n.t+=(Math.random()-.5)*1.1+(58-n.t)*.05;n.v+=(Math.random()-.5)*.2+(2.2-n.v)*.08;n.s+=(Math.random()-.5)*.9+(32-n.s)*.05;
 if(!n.f&&!n.cool&&Math.random()<.0012)fault(n,Object.values(LBL)[Math.random()*4|0]);
 if(n.cool)n.cool--;
 if(n.f){const f=n.f;f.age++;const sev=Math.min(f.peak,f.peak*f.age/10);f.sev=sev;
  if(f.l=="thermal_overheat"||f.l=="electrical_fault")n.t+=3.2*f.peak;else if(f.l=="bearing_wear")n.v+=.9*f.peak;else{n.s+=3.8*f.peak;n.v+=.25*f.peak}
  if(--f.left<=0&&!n.busy){n.f=null;n.cool=60}
  if(sev>=.4&&!n.busy&&!f.seen){f.seen=1;ST.an++;swarm(n,f.l,sev,Math.min(.99,.45+sev*.5+Math.random()*.08-.04))}}
 n.t=Math.min(n.t,150);n.s=Math.min(n.s,140);n.v=Math.min(n.v,40);
 n.h.push(n.t);if(n.h.length>60)n.h.shift();n.heat=Math.min(1,Math.max(n.t/115,n.s/100,n.v/12))}
 ui()}
// ── agent swarm ──
function tr(n,th,ag,msg,k=""){n.log.push({th,ag,msg,k});if(n.log.length>40)n.log.shift();if(sel===n)itr()}
async function swarm(n,label,sev,conf){
 n.busy=1;const th=uid(),t0=Date.now(),L=(a,m,k)=>tr(n,th,a,m,k);n.st="investigating";
 try{await sleep(500);
 const cor=(label=="thermal_overheat"||label=="electrical_fault")&&n.t>=85||label=="structural_crack"&&n.s>=70||label=="bearing_wear"&&n.v>=6;
 if(conf<.5||!(cor||conf>=.85)){L("Validator","false positive – closed");n.st="nominal";return}
 L("Validator",`confirmed · conf ${conf.toFixed(2)} · sensor corroboration ${cor}`);await sleep(550);
 const ev=KB.filter(e=>e[1]==KW[label]);
 if(!ev.length){L("Compliance RAG","no authoritative evidence → abstain & escalate","e");n.st="escalated";return}
 L("Compliance RAG",`${ev.length} manual passages: ${ev.map(e=>e[0]).join(", ")}`);await sleep(550);
 const dep=dependents(n.i),risk=.45*sev+.15*conf+.2*(.5*n.cr+.5*Math.min(dep/5,1))+.1*.4+.1*0;
 L("Risk",`risk ${risk.toFixed(2)} · blast radius ${dep} dependents`);await sleep(500);
 let [a,p]=policy(label,sev);L("Planner",`${a}(${ACT[a].k}=${p}) – initial proposal`);await sleep(500);
 let sp=ACT[a];if(p<sp.lo||p>sp.hi){L("Verifier",`${sp.k}=${p} outside [${sp.lo},${sp.hi}] ✗`,"e");p=Math.min(sp.hi,Math.max(sp.lo,p));await sleep(450);L("Planner",`self-corrected → ${sp.k}=${p}`)}
 const cites=KB.filter(e=>e[1]==KW[label]&&e[2]==a).map(e=>e[0]);
 if(!cites.length){L("Verifier","no manual supports this action → escalate","e");n.st="escalated";return}
 if(a=="throttle_load"&&n.t-.45*p>=85){L("Verifier","dry-run: still >85°C","e");n.st="escalated";return}
 L("Verifier",`bounds ✓ evidence ✓ (${cites.join(", ")}) dry-run ✓`);await sleep(450);
 if(sp.ph||(risk>=.6&&!AUTO)){n.st="awaiting";const nonce=uid()+uid();
  const dec=await new Promise(res=>{pend.set(th,{n,a,p,risk,nonce,res,cites});L("HITL Gate",`signed approval required for ${a} (risk ${risk.toFixed(2)})`,"e");appr()});
  pend.delete(th);appr();led(dec.ok?"approval":"rejection",n.id,`${a} ${ACT[a].k}=${p} sig:${dec.sig}`);
  if(!dec.ok){L("HITL Gate",`rejected by operator`,"e");n.st="escalated";return}
  L("HITL Gate",`approved · sig ${dec.sig} · nonce single-use`,"r");await sleep(350)}
 n.f=null;n.cool=60;n.t=Math.max(58,n.t-25);n.v=2.2;n.s=Math.min(n.s,34);
 led("remediation",n.id,`${a} ${ACT[a].k}=${p} risk:${risk.toFixed(2)} cites:${cites.join("|")} mode:${sp.ph||risk>=.6?"human-approved":"autopilot"}`);const sec=(Date.now()-t0)/1e3;ST.heal++;ST.mt.push(sec);n.st="healed";L("Executor",`${a} dispatched (simulated actuator) · ${sec.toFixed(1)}s`,"r");
 setTimeout(()=>{if(n.st=="healed")n.st="nominal"},6000)
 }finally{n.busy=0;setTimeout(()=>{if(n.st=="escalated"||n.st=="investigating")n.st="nominal"},8000)}}
async function sign(th,nonce,ok){if(!crypto.subtle)return"n/a";key=key||await crypto.subtle.generateKey({name:"HMAC",hash:"SHA-256"},false,["sign"]);
 const s=await crypto.subtle.sign("HMAC",key,new TextEncoder().encode(`${th}|${nonce}|${+ok}`));return[...new Uint8Array(s)].slice(0,8).map(b=>b.toString(16).padStart(2,"0")).join("")}
function appr(){const el=$("#appr"),e=[...pend.entries()][0];if(!e){el.style.display="none";return}
 const[th,r]=e;el.style.display="block";el.innerHTML=`<h3>Human approval · ${r.n.id}</h3><b style="color:var(--a)">${r.a}</b> ${ACT[r.a].k}=${r.p}<br><span style="color:var(--m)">risk ${r.risk.toFixed(2)} · ${ACT[r.a].ph?"physical intervention":"software action"} · cites ${r.cites.join(", ")}</span>
 <div class="chips"><button class="ok" id="ay">Sign & approve</button><button class="no" id="an">Reject</button></div>`;
 const go=async ok=>{if(used.has(r.nonce))return;used.add(r.nonce);r.res({ok,sig:await sign(th,r.nonce,ok)})};$("#ay").onclick=()=>go(true);$("#an").onclick=()=>go(false)}
// ── tamper-evident audit ledger (SHA-256 hash chain) ──
const LED=[];let AUTO=false,LQ=Promise.resolve();const Z="0".repeat(64);
const sha=async s=>{if(!crypto.subtle)return"n/a";const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")};
const hh=(e,prev)=>sha(prev+JSON.stringify([e.i,e.ts,e.type,e.node,e.detail]));
const led=(type,node,detail)=>LQ=LQ.then(async()=>{const prev=LED.length?LED[LED.length-1].h:Z,e={i:LED.length,ts:new Date().toISOString(),type,node,detail,prev};e.h=await hh(e,prev);LED.push(e)});
async function chk(a){let p=Z;for(const e of a){if(e.prev!==p||await hh(e,p)!==e.h)return e.i;p=e.h}return -1}
const mod=(h)=>{const m=$("#mod");m.style.display="block";m.innerHTML=h+'<div class="chips"><button id="mx">Close</button></div>';$("#mx").onclick=()=>m.style.display="none"};
function showLedger(){mod(`<h3>Audit ledger · ${LED.length} entries</h3><div style="color:var(--m);margin-bottom:6px">Every approval and remediation is hash-chained (SHA-256). Edit one entry and the chain breaks.</div>

 $("#le").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({system:"Corona",exported:new Date().toISOString(),ledger:LED},null,2)],{type:"application/json"}));a.download="corona-audit-ledger.json";a.click()}}
function showArch(){mod(`<h3>Platform architecture</h3><table>
 <tr><td>Edge vision</td><td>ViT + EfficientNet-V2 (optical + thermal), TensorRT/ONNX, federated learning (FedAvg + clipping + DP noise)</td></tr>

 <tr><td>Memory</td><td>pgvector semantic chunks + Neo4j <i>temporal</i> graph (aging, failures, time-bounded dependencies) · cross-encoder rerank · abstain-if-no-evidence</td></tr>

 <tr><td>Delivery</td><td>Docker Compose (CPU/GPU) · Helm chart · CI</td></tr></table>
 <p style="color:var(--m)">This page is the browser simulation. The full stack lives in <a href="platform/README.md">platform/</a>.</p>`)}
function showMe(){mod(`<h3>Builder</h3><b style="font-size:16px">NIKHIL CHARY SRIRAMOJU</b><br>B.Tech, Computer Science &amp; Engineering — Vaagdevi College of Engineering (2023–2027)<br><span style="color:var(--m)">Thorrur, Warangal, Telangana, India</span>
 <h3 style="margin-top:10px">Experience</h3><div>Machine Learning Engineer Intern — Yuva Intern (NSDC) · Aug–Sep 2026</div><div>Data Analytics Intern — Thiranex · Jul–Aug 2026</div>
 <h3 style="margin-top:10px">Certifications</h3><span class="bd">NASSCOM · Skill India Digital Hub — AI-Data Engineering &amp; Cloud Infrastructure Analyst</span><span class="bd">IBM SkillsBuild — AI Fundamentals</span><span class="bd">Reliance Foundation — AI/ML Engineer Foundation</span>
 <h3 style="margin-top:10px">Connect</h3><a href="https://github.com/Nikhil-creat" target="_blank" rel="noopener">GitHub</a> · <a href="https://in.linkedin.com/in/nikhil-chary-sriramoju-95041b38a" target="_blank" rel="noopener">LinkedIn</a> · <a href="mailto:sriramojunikhil66@gmail.com">Email</a>
 <h3 style="margin-top:10px">Skills shown in this project</h3>${["Agentic AI","LangGraph","RAG","Computer Vision","Federated Learning","FastAPI","Next.js","Kafka","Neo4j","Post-quantum crypto","Docker/Helm","Observability"].map(s=>`<span class="bd">${s}</span>`).join("")}`)}
$("#bL").onclick=showLedger;$("#bA").onclick=showArch;$("#bB").onclick=showMe;$("#auto").onchange=e=>AUTO=e.target.checked;
// ── UI ──
const col=n=>({nominal:"#38e8ff",investigating:"#38e8ff",awaiting:"#ffc24b",healed:"#3dffa8",escalated:"#ff5d6c"}[n.st]);
function forecast(n){const h=n.h.slice(-25);if(h.length<8)return"…";const m=h.length,sx=m*(m-1)/2,sy=h.reduce((a,b)=>a+b),sxy=h.reduce((a,b,i)=>a+i*b,0),sxx=h.reduce((a,_,i)=>a+i*i,0);
 const b=(m*sxy-sx*sy)/(m*sxx-sx*sx||1);if(b<=.2)return"stable";const eta=(85-h[m-1])/b*.5;return eta<=0?"threshold exceeded":`~${eta.toFixed(0)}s to 85°C`}

 $("#k6").textContent=Math.round(100*N.reduce((a,n)=>a+n.heat*n.cr,0)/N.reduce((a,n)=>a+n.cr,0))+"%";
 $("#nl").innerHTML=N.map(n=>`<div class="n ${n===sel?"s":""}" data-i="${n.i}"><span><i class="d" style="background:${col(n)}"></i>${n.id} ${n.n}</span><span>${n.t.toFixed(0)}°</span></div>`).join("");
 $("#fl").innerHTML=`Edge clients: 3 · global v${ST.fl}<br>FedAvg + clipping + DP noise`;
 if(sel){$("#it").textContent=`${sel.id} · ${sel.n}`;$("#ib").innerHTML=`<span style="font-family:ui-monospace,monospace;color:var(--t)">T ${sel.t.toFixed(1)}°C · V ${sel.v.toFixed(1)} mm/s · S ${sel.s.toFixed(0)}%</span><br>state: <b style="color:${col(sel)}">${sel.st}</b> · forecast: ${forecast(sel)}
 <svg viewBox="0 0 100 30" style="width:100%;height:46px"><polyline fill="none" stroke="#38e8ff" stroke-width="1" vector-effect="non-scaling-stroke" points="${sel.h.map((v,i)=>`${i/59*100},${30-Math.min(v/130,1)*28}`).join(" ")}"/></svg>`}}

$("#nl").onclick=e=>{const d=e.target.closest(".n");if(d)pick(N[+d.dataset.i])};
// ── copilot ──
function cmd(s){s=s.trim().toLowerCase();if(!s)return;const say=m=>{const n=sel||N[0];tr(n,"c","Copilot",m)};let m;
