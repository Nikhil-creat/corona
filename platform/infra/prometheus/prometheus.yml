global: { scrape_interval: 5s, evaluation_interval: 15s }
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: swarm-worker
    static_configs: [{ targets: ["worker:9101"] }]
  - job_name: edge-vision
    static_configs: [{ targets: ["vision-edge:9102"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
